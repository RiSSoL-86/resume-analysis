version: 1.0.0
domain: level
specialization: system_analyst
experience_thresholds:
  middle:
    typical_min_months: 24
    signal: baseline
  middle_plus:
    typical_min_months: 36
    exception:
      min_months: 24
      condition: exceptionally_strong_must_have_evidence
  senior:
    typical_min_months: 60
    exception:
      min_months: 48
      condition: strong_repeated_design_and_responsibility
rules:
  - id: level.experience.not_sufficient_alone
    principle: Стаж задает нижнюю границу ожиданий, но не доказывает уровень без содержания задач.
  - id: level.system_analyst.middle_plus
    principle: Middle+ обычно начинается примерно с трех лет профильного опыта.
  - id: level.system_analyst.senior
    principle: Senior обычно начинается примерно с пяти лет и требует повторяющегося проектирования и ответственности за решения.
  - id: level.system_analyst.exception
    principle: Более высокий грейд при меньшем стаже допустим только как явно объясненное исключение с сильными доказательствами.
