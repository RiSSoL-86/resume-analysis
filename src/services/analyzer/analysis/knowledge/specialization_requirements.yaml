version: 2.0.0
domain: specialization
profiles:
  system_analyst:
    markers:
      - {id: sa.design, importance: profile_core, evidence: Проектирование систем, API, БД, интеграций или контрактов.}
      - {id: sa.rest, importance: must_have, evidence: Практическая работа с REST; проектирование усиливает сигнал.}
      - {id: sa.soap, importance: must_have, evidence: Практика или проверяемое базовое понимание SOAP.}
      - {id: sa.message_broker, importance: must_have, alternatives: [Kafka, RabbitMQ], evidence: Применение брокера в задачах.}
      - {id: sa.sql, importance: profile_support, evidence: SQL в конкретных задачах.}
      - {id: sa.modeling, importance: profile_support, alternatives: [BPMN, UML, C4]}
  business_analyst:
    markers:
      - {id: ba.requirements, importance: profile_core}
      - {id: ba.bpmn, importance: profile_core}
      - {id: ba.integration, importance: advantage}
  product_analyst:
    markers:
      - {id: product.sql, importance: profile_core}
      - {id: product.python, importance: profile_core}
      - {id: product.ab_tests, importance: differentiator}
rules:
  - id: actions_over_title
    principle: Профиль определяется действиями, а не названием должности.
  - id: mixed_profile
    principle: Для смешанного профиля оцени основной и альтернативный профиль и спроси соотношение задач.
  - id: missing_not_absent
    principle: Не найденный must-have означает необходимость проверки, а не автоматический отказ.
