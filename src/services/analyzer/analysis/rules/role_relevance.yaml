version: 1.0.0
layer: role_relevance
rules:
  - id: role.profile_from_actions
    principle: Целевую роль кандидата определяют повторяющиеся профессиональные действия, а не название должности.
  - id: role.core_skills
    principle: Для целевой роли выдели ядро профессиональных навыков; периферийные навыки не должны маскировать отсутствие ядра.
  - id: role.evidence_relative
    principle: Глубину и доказанность навыка оценивай относительно роли — для инженерных ролей нужно конкретное практическое применение в опыте, для аналитиков — понимание, постановка и проектирование.
  - id: role.it_bias
    principle: Сервис отбирает людей в IT-продукты Альфа-Банка, поэтому техническое образование и подтверждённые IT-навыки — усиливающий сигнал; их отсутствие для IT-роли ослабляет кандидата.
  - id: role.mixed_profile
    principle: Для смешанного профиля оцени основной и смежный профиль и задай вопрос о соотношении задач.
  - id: role.missing_not_absent
    principle: Не найденный ключевой навык роли означает необходимость проверки (вопрос), а не автоматический отказ.
