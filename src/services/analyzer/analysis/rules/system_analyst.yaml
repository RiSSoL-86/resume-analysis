version: 1.0.0
layer: specialization
specialization: system_analyst
rules:
  - id: system_analyst.design_actions
    signal: profile_support
    strength: high
    principle: Проектирование систем, API, БД, интеграций и контрактов является сильным признаком системного аналитика.
  - id: system_analyst.profile_continuity
    signal: profile_support
    strength: high
    principle: Повторение системного проектирования в нескольких местах подтверждает устойчивый профиль.
  - id: system_analyst.integration_design
    signal: profile_support
    strength: high
    principle: Проектирование интеграций через REST, SOAP, Kafka, RabbitMQ или IBM MQ подтверждает профиль.
  - id: system_analyst.integration_stack
    signal: skill_support
    strength: medium
    principle: REST, SOAP, брокеры сообщений и БД являются профильным стеком, но оцениваются только вместе с действиями.
  - id: system_analyst.rest.depth
    levels:
      basic: Указано использование REST или вызов API.
      intermediate: Описаны методы, спецификации, Swagger/OpenAPI или интеграционные контракты.
      advanced: Описано проектирование API, контрактов, ошибок, авторизации или архитектуры интеграции.
  - id: system_analyst.kafka.depth
    levels:
      basic: Kafka указана только в списке или стеке.
      intermediate: Описана практическая работа с событиями, топиками или сообщениями.
      advanced: Описано проектирование топиков, форматов и схем сообщений или архитектуры обмена.
  - id: system_analyst.sql.depth
    levels:
      basic: Select, join и простые выгрузки.
      intermediate: Подзапросы, агрегации, ERD или запросы средней сложности.
      advanced: Оконные функции, оптимизация, триггеры или сложные многоэтапные запросы.
  - id: system_analyst.level.senior.design
    signal: level_support
    strength: high
    principle: Senior поддерживают повторяющееся системное проектирование, ответственность за решения, согласование с архитектором и сложные проекты.
  - id: system_analyst.level.senior.practice
    signal: level_support
    strength: high
    principle: Менторство, технические интервью, онбординг и развитие практики усиливают senior-оценку.
  - id: system_analyst.adjacent_business_analysis
    signal: adjacent_profile
    strength: low
    principle: Сбор требований и BPMN поддерживают смежный бизнес-анализ, но не отменяют основной системный профиль.
  - id: system_analyst.project_context
    principle: Банковские, Ecom, интеграционные, микросервисные и отчётные проекты хранятся отдельно от технологий.
